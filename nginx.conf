# Reverse proxy that fronts the songbook + songlist on a single origin (:8091 on
# the host). Bind-mounted into the `nginx` service in docker-compose.yml, so it
# can be edited and reloaded without rebuilding any image.
server {
    listen 80;
    server_name _;

    # Song data comes from the self-hosted songlist service (same origin, no CORS).
    location = /songs.json {
        proxy_pass http://songlist:8080/songs.json;
    }
    location = /songs.xml {
        proxy_pass http://songlist:8080/songs.xml;
    }

    # Never cache the service worker so PWA updates propagate.
    location = /sw.js {
        proxy_pass http://songbook:8080/sw.js;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-cache";
    }

    # Everything else is the songbook SPA (its `serve` handles the SPA fallback).
    location / {
        proxy_pass http://songbook:8080;
        proxy_set_header Host $host;
    }
}
